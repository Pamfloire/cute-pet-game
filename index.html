<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cute Cat Pet Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-card">
    <div class="status">😸 Mood: <span id="mood">Happy</span></div>
    <div class="pet-box">🐱</div>
    <div class="actions">
      <button onclick="feedPet()">🍕 Feed</button>
      <button onclick="petCat()">❤️ Pet</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
